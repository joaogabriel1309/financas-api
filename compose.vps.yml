name: financas-vps

x-api: &api
  image: financas-vps-api:local
  build: .
  environment: &api-env
    NODE_ENV: production
    PORT: "3000"
    DATABASE_URL: postgresql://financas:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@postgres:5432/financas?schema=public
    JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Configure JWT_REFRESH_SECRET}

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: financas
      POSTGRES_DB: financas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U financas -d financas"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *api
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    logging: *logging

  web:
    image: financas-vps-web:local
    build: ../financas-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_URL: http://api:3000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
